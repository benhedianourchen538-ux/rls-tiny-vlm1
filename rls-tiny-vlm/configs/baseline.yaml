# Main model (architecture + training). Referenced in README as configs/baseline.yaml.
seed: 0
data_dir: data
image_mode: normal          # normal | zeros | shuffle   (zeros/shuffle = blind baseline, see blind.yaml)
model:
  img_size: 64
  enc_channels: [32, 64, 128, 128]   # 4 conv blocks, 3 max-pools: 64 -> 8x8 grid = 64 visual tokens
  n_pools: 3
  d_model: 128
  n_heads: 4
  n_layers: 4
  dropout: 0.1
  visual_tokens: grid                # grid | global (1 pooled token)
  visual_causal: false               # visual tokens attend bidirectionally
train:
  epochs: 30
  batch_size: 64
  lr: 0.001
  weight_decay: 0.01
  warmup_steps: 300
  grad_clip: 1.0
  amp: false
  num_workers: 0
  val_gen_batches: 2                 # 2 x 256 val images get greedy-decoded each epoch (full val loss always)

# E1 blind baseline: IDENTICAL to baseline.yaml except the images are replaced by zeros.
seed: 0
data_dir: data
image_mode: zeros
model:
  img_size: 64
  enc_channels: [32, 64, 128, 128]
  n_pools: 3
  d_model: 128
  n_heads: 4
  n_layers: 4
  dropout: 0.1
  visual_tokens: grid
  visual_causal: false
train:
  epochs: 30
  batch_size: 64
  lr: 0.001
  weight_decay: 0.01
  warmup_steps: 300
  grad_clip: 1.0
  amp: false
  num_workers: 0
  val_gen_batches: 2
